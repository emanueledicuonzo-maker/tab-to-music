<!doctype html>
<html lang="it">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Leggio</title>
<style>
  :root { color-scheme: light dark; --bordo: #8883; --acceso: #e8a33d; }
  body { margin: 0; font: 15px/1.5 system-ui, sans-serif; padding: 20px; max-width: 1100px; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  p.nota { margin: 0 0 20px; opacity: .65; font-size: 13px; }
  label.scegli { display: inline-block; padding: 10px 18px; border: 1px dashed var(--bordo);
                 border-radius: 10px; cursor: pointer; }
  label.scegli input { display: none; }
  .barra { display: flex; gap: 12px; align-items: center; margin: 20px 0; }
  button { font: inherit; padding: 8px 16px; border: 1px solid var(--bordo); border-radius: 8px;
           background: transparent; color: inherit; cursor: pointer; }
  button.attivo { border-color: var(--acceso); color: var(--acceso); }
  #tempo { font-variant-numeric: tabular-nums; opacity: .7; }
  #scorri { flex: 1; }
  table { border-collapse: collapse; margin-bottom: 16px; }
  td { padding: 4px 8px; border-bottom: 1px solid var(--bordo); }
  td.nome { text-transform: capitalize; }
  pre { overflow-x: auto; line-height: 1.7; font-size: 14px; }
  #testo { min-height: 1.6em; margin: 0 0 12px; font-size: 17px; opacity: .5; }
  #testo b { color: var(--acceso); font-weight: 600; }
  .n { padding: 1px 0; border-radius: 3px; }
  .n.ora { background: var(--acceso); color: #000; }
  #suona { display: none; }
</style>

<h1>Leggio</h1>
<p class="nota">
  Scegli la cartella che ti ha prodotto <code>tablatura</code>: il
  <code>leggio.json</code> e le tracce separate. Non parte niente da qui —
  i file restano sul tuo dispositivo, la pagina non li manda a nessuno.
</p>

<label class="scegli">Scegli i file… <input id="file" type="file" multiple accept=".json,audio/*"></label>
<p class="nota" id="stato"></p>

<div id="suona">
  <div class="barra">
    <button id="via">▶ Suona</button>
    <input id="scorri" type="range" min="0" max="1000" value="0">
    <span id="tempo">0:00</span>
  </div>
  <table id="tracce"></table>
  <p id="testo"></p>
  <pre id="tab"></pre>
</div>

<script>
const CELLA = 2;
let DATI = null, tracce = [], audio = [], guida = null, solista = null, acceso = null;
const caselle = new Map();
const $ = id => document.getElementById(id);

$("file").onchange = async e => {
  const scelti = [...e.target.files];
  const descrizione = scelti.find(f => f.name.endsWith(".json"));
  if (!descrizione) { $("stato").textContent = "Manca leggio.json: è nella cartella dei risultati."; return; }
  DATI = JSON.parse(await descrizione.text());

  const suoni = scelti.filter(f => f.type.startsWith("audio/") || /\.(wav|mp3|flac|ogg|m4a)$/i.test(f.name));
  if (!suoni.length) { $("stato").textContent = "Nessuna traccia audio fra i file scelti."; return; }

  tracce = suoni.map(f => {
    const a = new Audio(URL.createObjectURL(f));
    a.preload = "auto";
    return { nome: f.name.replace(/\.[^.]+$/, ""), audio: a, spento: false, volume: 1 };
  }).sort((a, b) => a.nome.localeCompare(b.nome));
  audio = tracce.map(t => t.audio);
  guida = audio[0];

  $("stato").textContent = `${tracce.length} tracce · ${DATI.strumento}`;
  $("suona").style.display = "block";
  costruisci();
};

function applicaVolumi() {
  for (const t of tracce) {
    const zitto = t.spento || (solista !== null && solista !== t.nome);
    t.audio.volume = zitto ? 0 : t.volume;
  }
}

function costruisci() {
  const tabella = $("tracce");
  tabella.textContent = "";
  for (const t of tracce) {
    const riga = document.createElement("tr");
    riga.innerHTML = `<td class="nome">${t.nome}</td>
      <td><button class="spegni attivo">suona</button></td>
      <td><button class="solo">solo</button></td>
      <td><input type="range" min="0" max="100" value="100"></td>`;
    const [spegni, solo] = riga.querySelectorAll("button");
    spegni.onclick = () => {
      t.spento = !t.spento;
      spegni.textContent = t.spento ? "muta" : "suona";
      spegni.classList.toggle("attivo", !t.spento);
      applicaVolumi();
    };
    solo.onclick = () => {
      solista = solista === t.nome ? null : t.nome;
      for (const b of tabella.querySelectorAll(".solo"))
        b.classList.toggle("attivo", b === solo && solista !== null);
      applicaVolumi();
    };
    riga.querySelector("input").oninput = ev => { t.volume = ev.target.value / 100; applicaVolumi(); };
    tabella.append(riga);
  }

  const pre = $("tab");
  pre.textContent = "";
  caselle.clear();
  for (let corda = DATI.corde.length - 1; corda >= 0; corda--) {
    const riga = document.createElement("div");
    riga.append(DATI.corde[corda].padStart(2) + "|");
    for (let i = 0; i < DATI.celle; i++) {
      if (i > 0 && i % DATI.perBattuta === 0) riga.append("|");
      const nota = DATI.note.find(n => n.corda === corda && n.cella === i);
      const span = document.createElement("span");
      span.className = "n";
      span.textContent = nota ? String(nota.tasto).padEnd(CELLA, "-") : "-".repeat(CELLA);
      if (nota) caselle.set(`${corda}:${i}`, span);
      riga.append(span);
    }
    riga.append("|");
    pre.append(riga);
  }
}

$("via").onclick = () => {
  if (guida.paused) { audio.forEach(a => { a.currentTime = guida.currentTime; a.play(); }); $("via").textContent = "⏸ Ferma"; }
  else { audio.forEach(a => a.pause()); $("via").textContent = "▶ Suona"; }
};
$("scorri").oninput = () => {
  const quando = ($("scorri").value / 1000) * (guida.duration || 0);
  audio.forEach(a => { a.currentTime = quando; });
};

function orologio(s) {
  return `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, "0")}`;
}

function scriviTesto(ora) {
  const parole = (DATI && DATI.parole) || [];
  const testo = $("testo");
  if (!parole.length) return;
  let i = 0;
  while (i + 1 < parole.length && parole[i + 1].quando <= ora) i++;
  if (parole[i].quando > ora) { testo.textContent = ""; return; }
  testo.textContent = parole.slice(Math.max(0, i - 4), i).map(p => p.testo).join(" ") + " ";
  const b = document.createElement("b");
  b.textContent = parole[i].testo;
  testo.append(b, " " + parole.slice(i + 1, i + 6).map(p => p.testo).join(" "));
}

setInterval(() => {
  if (!guida || !DATI) return;
  const ora = guida.currentTime;
  // I lettori vanno ognuno per conto suo: ogni tanto si riallineano alla guida.
  for (const a of audio) if (Math.abs(a.currentTime - ora) > 0.08) a.currentTime = ora;
  $("tempo").textContent = orologio(ora);
  if (guida.duration) $("scorri").value = Math.round((ora / guida.duration) * 1000);
  scriviTesto(ora);

  const vicina = DATI.note.reduce((scelta, n) => (n.quando <= ora + DATI.durataCella / 2 ? n : scelta), null);
  const chiave = vicina ? `${vicina.corda}:${vicina.cella}` : null;
  if (chiave !== acceso) {
    if (acceso) caselle.get(acceso)?.classList.remove("ora");
    if (chiave) caselle.get(chiave)?.classList.add("ora");
    acceso = chiave;
  }
}, 100);
</script>
</html>
