<!doctype html>
<html lang="it">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tablatura</title>
<link rel="manifest" href="/pwa/manifest.webmanifest">
<link rel="icon" href="/pwa/icona-192.png">
<meta name="theme-color" content="#0b0b14">
<style>
  :root { color-scheme: dark; --bordo: #ffffff14; --acceso: #ffb020; --rosa: #ff3d81; --ciano: #2de2e6;
          --fondo: #06060b; --pannello: #ffffff08; --morbido: #ffffff0c; --testo: #eef0f6; --tenue: #9aa0b4; }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; margin: 0; }
  body { font: 15px/1.5 system-ui, "Ubuntu", sans-serif; display: flex; flex-direction: column; color: var(--testo); background: var(--fondo); }
  header { display: flex; align-items: center; gap: 10px; padding: 10px 18px; border-bottom: 1px solid var(--bordo);
           background: linear-gradient(90deg, #ffb02010, #ff3d810c 40%, #2de2e608); }
  .marchio { display: flex; align-items: center; gap: 10px; margin-right: 10px; font-weight: 800; letter-spacing: .02em; }
  .marchio i { width: 28px; height: 28px; border-radius: 9px; background: conic-gradient(from 200deg, var(--acceso), var(--rosa), var(--ciano), var(--acceso));
               box-shadow: 0 0 18px #ff3d8166; }
  header h1 { font-size: 14px; margin: 0 8px 0 0; font-weight: 500; color: var(--tenue); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  button { font: inherit; padding: 7px 16px; border: 1px solid var(--bordo); border-radius: 10px; background: var(--pannello);
           color: inherit; cursor: pointer; transition: border-color .15s, box-shadow .15s; }
  button:hover { border-color: #ffffff33; }
  button.primario { background: linear-gradient(135deg, var(--acceso), var(--rosa)); border: 0; color: #111; font-weight: 700;
                    box-shadow: 0 0 18px #ff3d8155; }
  button:disabled { opacity: .35; cursor: default; box-shadow: none; }
  #stato { margin-left: auto; font-size: 13px; color: var(--tenue); text-align: right; cursor: pointer; max-width: 50%;
           white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #stato.attivo { color: var(--testo); }
  #stato.attivo::before { content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 50%;
                          background: var(--acceso); box-shadow: 0 0 10px var(--acceso); margin-right: 8px; animation: pulsa .8s infinite alternate; }
  @keyframes pulsa { to { opacity: .25; } }
  main { flex: 1; position: relative; }
  #avanzamento { padding: 10px 18px 12px; border-bottom: 1px solid var(--bordo); background: #0b0b14; cursor: pointer; }
  #avanzamento .riga1 { display: flex; gap: 12px; align-items: baseline; font-weight: 700; }
  #avConto { margin-left: auto; color: var(--tenue); font-weight: 500; font-size: 13px; }
  #avFasi { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0; }
  #avFasi span { font-size: 12px; padding: 3px 10px; border-radius: 999px; border: 1px solid var(--bordo); color: var(--tenue); }
  #avFasi span.fatta { color: #6bffa0; border-color: #6bffa055; }
  #avFasi span.ora { color: #111; background: var(--acceso); border-color: var(--acceso); box-shadow: 0 0 14px #ffb02088;
                     animation: pulsa .8s infinite alternate; }
  .barra { height: 6px; border-radius: 6px; background: #ffffff10; overflow: hidden; }
  .barra i { display: block; height: 100%; width: 0; border-radius: 6px; transition: width .6s;
             background: linear-gradient(90deg, var(--acceso), var(--rosa), var(--ciano)); background-size: 200% 100%;
             animation: scorre 1.6s linear infinite; }
  @keyframes scorre { to { background-position: -200% 0; } }
  iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; background: var(--fondo); }
  .vuoto { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; gap: 18px;
           background: radial-gradient(700px 400px at 50% 40%, #ff3d8118, transparent 70%); }
  .vuoto p { font-size: 28px; font-weight: 800; margin: 0; }
  .vuoto small { color: var(--tenue); }
  .vuoto div { display: flex; gap: 10px; justify-content: center; }

  dialog { border: 1px solid var(--bordo); border-radius: 16px; padding: 0; width: min(900px, 94vw); max-height: 86vh;
           background: #0d0d16f2; color: inherit; box-shadow: 0 30px 90px #000c, 0 0 0 1px #ffffff08; }
  dialog[open] { display: flex; flex-direction: column; animation: entra .16s ease-out; }
  @keyframes entra { from { transform: translateY(8px) scale(.98); opacity: 0; } }
  dialog::backdrop { background: #000a; backdrop-filter: blur(4px); }
  .testa { display: flex; align-items: center; gap: 10px; padding: 14px 18px; border-bottom: 1px solid var(--bordo); }
  .testa h2 { font-size: 17px; margin: 0; flex: 1; }
  .chiudi { border: 0; background: transparent; font-size: 24px; line-height: 1; padding: 2px 10px; color: var(--tenue); }
  .chiudi:hover { color: var(--rosa); }
  .corpo { overflow: auto; padding: 8px 18px; flex: 1; }
  .piede { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; padding: 14px 18px; border-top: 1px solid var(--bordo); }
  .piede .spinta { margin-left: auto; }
  input[type=search], input[type=text], select { font: inherit; padding: 7px 12px; border: 1px solid var(--bordo);
           border-radius: 10px; background: #ffffff08; color: inherit; }
  select option { background: #111; }
  input[type=checkbox] { accent-color: var(--acceso); width: 16px; height: 16px; }
  .album { display: flex; align-items: center; gap: 12px; font-size: 12px; text-transform: uppercase; letter-spacing: .14em;
           margin: 18px 0 6px; color: var(--ciano); }
  .album img { width: 48px; height: 48px; border-radius: 8px; object-fit: cover; box-shadow: 0 6px 18px #0009; }
  .voce { display: flex; align-items: center; gap: 12px; padding: 7px 10px; border-radius: 10px; cursor: pointer; }
  .voce:hover { background: var(--morbido); }
  .voce .nome { flex: 1; }
  .voce .tipo { color: var(--tenue); font-size: 13px; }
  .voce.aperta { color: var(--acceso); font-weight: 700; }
  .percorso { display: flex; gap: 6px; flex: 1; }
  .percorso input { flex: 1; min-width: 0; }
  .libreria { display: grid; grid-template-columns: 260px 1fr; gap: 14px; min-height: 60vh; }
  #artisti { overflow: auto; max-height: 66vh; border-right: 1px solid var(--bordo); padding-right: 8px; }
  #canzoniArtista { overflow: auto; max-height: 66vh; }
  .artista { display: flex; justify-content: space-between; width: 100%; text-align: left; border: 0; background: transparent; padding: 6px 10px; border-radius: 8px; }
  .artista:hover { background: var(--morbido); }
  .artista.scelto { background: #ffb0201a; color: var(--acceso); }
  .artista small { color: var(--tenue); }
  .canzoneGP { display: flex; align-items: center; gap: 10px; padding: 7px 10px; border-radius: 10px; }
  .canzoneGP:hover { background: var(--morbido); }
  .canzoneGP .titolo { flex: 1; font-weight: 600; }
  .canzoneGP button { padding: 4px 10px; font-size: 13px; }
  .lavoro { display: grid; grid-template-columns: 120px 1fr; gap: 2px 12px; padding: 10px 0; border-bottom: 1px solid var(--bordo); }
  .lavoro .esito { font-size: 13px; font-weight: 700; }
  .lavoro .dett { grid-column: 2; font-size: 12px; color: var(--tenue); font-family: ui-monospace, monospace;
                  white-space: pre-wrap; word-break: break-all; }
  .esito.fatta { color: #6bffa0; } .esito.errore { color: var(--rosa); } .esito.lavorazione { color: var(--acceso); }
  label.opz { display: flex; align-items: center; gap: 6px; color: var(--tenue); }
</style>

<header>
  <span class="marchio"><i></i>Tablatura</span>
  <h1 id="titolo"></h1>
  <button id="bLibreria" class="primario">Tablature</button>
  <button id="bApri">Apri</button>
  <button id="bImporta">Importa</button>
  <button id="bInstalla" class="primario" hidden title="Installa Tablatura come app">Installa l'app</button>
  <span id="stato" title="Mostra la coda"></span>
</header>
<div id="avanzamento" hidden>
  <div class="riga1"><span id="avCanzone"></span><span id="avConto"></span></div>
  <div id="avFasi"></div>
  <div class="barra"><i id="avBarra"></i></div>
</div>
<main>
  <iframe id="foglio" hidden></iframe>
  <div class="vuoto" id="vuoto">
    <p>Che si suona?</p><small>Scegli una tablatura dall'archivio Guitar Pro: se il disco c'è, suona sul disco vero. Importa resta per tutto il resto.</small>
    <div><button data-vai="libreria" class="primario">Tablature</button><button data-vai="apri">Apri una canzone</button><button data-vai="importa">Importa</button></div>
  </div>
</main>

<dialog id="dLibreria">
  <div class="testa"><h2>Tablature</h2><input type="search" id="cercaArtista" placeholder="Cerca un artista…"><button class="chiudi" aria-label="Chiudi">×</button></div>
  <div class="corpo libreria">
    <div id="artisti"></div>
    <div id="canzoniArtista"><p style="color:var(--tenue)">Scegli un artista.</p></div>
  </div>
</dialog>

<dialog id="dApri">
  <div class="testa"><h2>Apri</h2><input type="search" id="cerca" placeholder="Cerca…"><button class="chiudi" aria-label="Chiudi">×</button></div>
  <div class="corpo" id="elenco"></div>
  <div class="piede">
    <span id="selApri" style="opacity:.7;font-size:13px">Clic su una canzone per aprirla qui. Spunta più canzoni per aprirle in schede.</span>
    <button class="spinta" id="bSchede" disabled>Apri le spuntate in schede</button>
  </div>
</dialog>

<dialog id="dImporta">
  <div class="testa">
    <h2>Importa</h2>
    <div class="percorso">
      <button id="bSu" title="Cartella sopra">↑</button>
      <button id="bMusica" title="Torna a Musica">Musica</button>
      <input type="text" id="dove" spellcheck="false" title="Scrivi una cartella e premi Invio">
    </div>
    <button class="chiudi" aria-label="Chiudi">×</button>
  </div>
  <div class="corpo" id="sfoglia"></div>
  <div class="piede">
    <label class="opz">Strumento
      <select id="strumento"><option value="basso">basso</option><option value="basso-dropd">basso drop D</option><option value="basso5">basso 5 corde</option>
        <option value="chitarra">chitarra</option><option value="chitarra-dropd">chitarra drop D</option></select></label>
    <label class="opz"><input type="checkbox" id="testo"> testo</label>
    <label class="opz">lingua
      <select id="lingua"><option value="en">inglese</option><option value="it">italiano</option><option value="es">spagnolo</option>
        <option value="fr">francese</option><option value="">la indovina</option></select></label>
    <button id="bTutto">Spunta tutto</button>
    <button class="spinta primario" id="bVia" disabled>Importa</button>
  </div>
</dialog>

<dialog id="dCoda">
  <div class="testa"><h2>Canzoni in lavorazione</h2><button class="chiudi" aria-label="Chiudi">×</button></div>
  <div class="corpo" id="lavori"></div>
  <div class="piede"><button class="spinta" id="bSvuota">Togli quelle finite</button></div>
</dialog>

<script>
const $ = id => document.getElementById(id);
const api = (url, corpo) => fetch(url, corpo === undefined ? {} :
  { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(corpo) }).then(r => r.json());
const percorsoTab = id => "/tab/" + id.split("/").map(encodeURIComponent).join("/") + "/tablatura.html";

let aperta = null;
let canzoni = [];

for (const d of document.querySelectorAll("dialog")) {
  d.querySelector(".chiudi").onclick = () => d.close();
  d.addEventListener("click", e => { if (e.target === d) d.close(); });
}

function apri(id) {
  aperta = id;
  try { localStorage.setItem("ultima", id); } catch {}
  $("foglio").src = percorsoTab(id);
  $("foglio").hidden = false;
  $("vuoto").hidden = true;
  $("titolo").textContent = "— " + id.split("/")[1];
  document.title = id.split("/")[1] + " — Tablatura";
  api("/api/preferenze", { ultima: id });
}

// ---------------------------------------------------------------- Apri
async function mostraApri() {
  canzoni = await api("/api/canzoni");
  $("cerca").value = "";
  disegnaElenco();
  $("dApri").showModal();
  $("cerca").focus();
}
function disegnaElenco() {
  const filtro = $("cerca").value.toLowerCase();
  const el = $("elenco");
  el.textContent = "";
  let album = null;
  const visibili = canzoni.filter(c => (c.album + " " + c.canzone).toLowerCase().includes(filtro));
  if (!visibili.length) el.innerHTML = `<p style="opacity:.6">${canzoni.length ? "Nessuna canzone trovata." : "Non c'è ancora nessuna canzone lavorata: usa Importa."}</p>`;
  for (const c of visibili) {
    if (c.album !== album) {
      album = c.album;
      const t = document.createElement("div");
      t.className = "album";
      if (c.copertina) { const img = document.createElement("img"); img.src = c.copertina; img.alt = ""; t.append(img); }
      t.append(album);
      el.append(t);
    }
    const r = document.createElement("label");
    r.className = "voce" + (c.id === aperta ? " aperta" : "");
    r.innerHTML = `<input type="checkbox"><span class="nome"></span>`;
    r.querySelector(".nome").textContent = c.canzone;
    const spunta = r.querySelector("input");
    spunta.dataset.id = c.id;
    spunta.onchange = contaSpuntate;
    r.querySelector(".nome").onclick = e => { e.preventDefault(); apri(c.id); $("dApri").close(); };
    el.append(r);
  }
  contaSpuntate();
}
function contaSpuntate() {
  const n = $("elenco").querySelectorAll("input:checked").length;
  $("bSchede").disabled = !n;
  $("bSchede").textContent = n ? `Apri le ${n} spuntate in schede` : "Apri le spuntate in schede";
}
$("cerca").oninput = disegnaElenco;
$("bSchede").onclick = () => {
  for (const s of $("elenco").querySelectorAll("input:checked")) window.open(percorsoTab(s.dataset.id), "_blank");
  $("dApri").close();
};

// ---------------------------------------------------------------- Tablature
let cercaTimer;
async function mostraLibreria() {
  $("dLibreria").showModal();
  $("cercaArtista").focus();
  if (!$("artisti").childNodes.length) disegnaArtisti("");
}
async function disegnaArtisti(filtro) {
  const lista = await api("/api/libreria/artisti?q=" + encodeURIComponent(filtro));
  const el = $("artisti");
  el.textContent = "";
  if (!lista.length) el.innerHTML = `<p style="color:var(--tenue)">Nessun artista.</p>`;
  for (const a of lista) {
    const b = document.createElement("button");
    b.className = "artista";
    b.innerHTML = `<span></span><small>${a.quante}</small>`;
    b.querySelector("span").textContent = a.artista;
    b.onclick = () => { el.querySelectorAll(".scelto").forEach(x => x.classList.remove("scelto")); b.classList.add("scelto"); disegnaCanzoni(a.artista); };
    el.append(b);
  }
}
async function disegnaCanzoni(artista) {
  const el = $("canzoniArtista");
  el.innerHTML = `<p style="color:var(--tenue)">Carico…</p>`;
  const [canzoni, { preferenze }] = await Promise.all([
    api("/api/libreria/canzoni?artista=" + encodeURIComponent(artista)), api("/api/stato")]);
  const giuste = preferenze.gpGiuste || {};
  el.textContent = "";
  const testa = document.createElement("div"); testa.className = "album"; testa.textContent = artista; el.append(testa);
  for (const c of canzoni) {
    const r = document.createElement("div");
    r.className = "canzoneGP";
    r.innerHTML = `<span class="titolo"></span>`;
    r.querySelector(".titolo").textContent = c.titolo;
    // Se hai segnato la versione giusta, il titolo apre direttamente lei.
    const giusta = giuste[`${artista}|${c.titolo}`];
    if (giusta) {
      r.querySelector(".titolo").textContent = "★ " + c.titolo;
      r.querySelector(".titolo").style.cursor = "pointer";
      r.querySelector(".titolo").title = "Apre la versione che hai segnato";
      r.querySelector(".titolo").onclick = () => suonaGP(giusta.archivio, giusta.nome, `${artista} — ${c.titolo}`);
    }
    c.versioni.forEach((v, i) => {
      const b = document.createElement("button");
      b.textContent = c.versioni.length > 1 ? (v.etichetta.replace(c.titolo, "").trim() || `versione ${i + 1}`) : "Apri";
      b.title = v.nome;
      if (giusta && giusta.nome === v.nome) b.classList.add("primario");
      b.onclick = () => suonaGP(v.archivio, v.nome, `${artista} — ${c.titolo}`);
      r.append(b);
    });
    el.append(r);
  }
}
function suonaGP(archivio, nome, titolo) {
  aperta = null;
  $("foglio").src = `/libreria/suona?archivio=${encodeURIComponent(archivio)}&nome=${encodeURIComponent(nome)}`;
  $("foglio").hidden = false;
  $("vuoto").hidden = true;
  $("titolo").textContent = "— " + titolo;
  $("dLibreria").close();
}
$("cercaArtista").oninput = e => { clearTimeout(cercaTimer); cercaTimer = setTimeout(() => disegnaArtisti(e.target.value), 200); };
$("bLibreria").onclick = mostraLibreria;

// ---------------------------------------------------------------- Importa
let qui = null;
async function vaiA(dove) {
  qui = await api("/api/sfoglia" + (dove ? "?dove=" + encodeURIComponent(dove) : ""));
  $("dove").value = qui.dove;
  const el = $("sfoglia");
  el.textContent = "";
  if (!qui.cartelle.length && !qui.canzoni.length) el.innerHTML = `<p style="opacity:.6">Cartella vuota.</p>`;
  const riga = (nome, cartella) => {
    const r = document.createElement("label");
    r.className = "voce";
    r.innerHTML = `<input type="checkbox"><span class="nome"></span><span class="tipo"></span>`;
    r.querySelector(".nome").textContent = (cartella ? "📁 " : "♪ ") + nome;
    r.querySelector(".tipo").textContent = cartella ? "apri ›" : "";
    const spunta = r.querySelector("input");
    spunta.dataset.percorso = qui.dove.replace(/\/$/, "") + "/" + nome;
    spunta.onchange = contaDaImportare;
    if (cartella) r.querySelector(".nome").onclick = r.querySelector(".tipo").onclick =
      e => { e.preventDefault(); vaiA(spunta.dataset.percorso); };
    el.append(r);
  };
  qui.cartelle.forEach(n => riga(n, true));
  qui.canzoni.forEach(n => riga(n, false));
  contaDaImportare();
  api("/api/preferenze", { cartella: qui.dove });
}
function contaDaImportare() {
  const s = [...$("sfoglia").querySelectorAll("input:checked")];
  $("bVia").disabled = !s.length;
  $("bVia").textContent = s.length ? `Importa (${s.length})` : "Importa";
}
async function mostraImporta() {
  const { preferenze: p } = await api("/api/stato");
  if (p.strumento) $("strumento").value = p.strumento;
  $("testo").checked = p.testo ?? true;
  if (p.lingua !== undefined) $("lingua").value = p.lingua;
  await vaiA(p.cartella);
  $("dImporta").showModal();
}
$("bSu").onclick = () => vaiA(qui.su);
$("bMusica").onclick = () => vaiA(qui.musica);
$("dove").onkeydown = e => { if (e.key === "Enter") vaiA($("dove").value); };
$("testo").onchange = () => { $("lingua").disabled = !$("testo").checked; };
$("bTutto").onclick = () => {
  const tutte = [...$("sfoglia").querySelectorAll("input")];
  const accendi = tutte.some(s => !s.checked);
  tutte.forEach(s => { s.checked = accendi; });
  contaDaImportare();
};
$("bVia").onclick = async () => {
  const percorsi = [...$("sfoglia").querySelectorAll("input:checked")].map(s => s.dataset.percorso);
  const { accodate } = await api("/api/importa", {
    percorsi, strumento: $("strumento").value, testo: $("testo").checked, lingua: $("lingua").value,
  });
  $("dImporta").close();
  if (!accodate) alertino("Lì dentro non ho trovato canzoni.");
  aggiorna();
};
function alertino(testo) { $("stato").textContent = testo; }

// ---------------------------------------------------------------- la coda
let giaFatte = new Set();
async function aggiorna() {
  let dati;
  try { dati = await api("/api/stato"); } catch { dati = { spento: true, coda: [], fasi: [] }; }
  if (dati.spento) {
    $("stato").classList.remove("attivo");
    $("stato").textContent = "Programma spento: si riguardano le canzoni salvate, per importare riapri l'icona.";
    $("avanzamento").hidden = true;
    $("bImporta").disabled = true;
    return;
  }
  $("bImporta").disabled = false;
  const coda = dati.coda;
  const corso = coda.find(l => l.stato === "in lavorazione");
  const attesa = coda.filter(l => l.stato === "in attesa").length;
  const fatte = coda.filter(l => l.stato === "fatta");
  const errori = coda.filter(l => l.stato === "errore").length;
  $("stato").classList.toggle("attivo", !!corso);
  // La barra grande: quale canzone, a che fase, quanto manca in tutto.
  $("avanzamento").hidden = !corso;
  if (corso) {
    const n = coda.indexOf(corso);
    $("avCanzone").textContent = "Sto lavorando: " + corso.titolo;
    $("avConto").textContent = `${n + 1} di ${coda.length}` + (attesa ? ` · ${attesa} in attesa` : "");
    $("avFasi").textContent = "";
    dati.fasi.forEach((nome, i) => {
      const s = document.createElement("span");
      s.textContent = nome;
      s.className = i < corso.fase ? "fatta" : i === corso.fase ? "ora" : "";
      $("avFasi").append(s);
    });
    const dentro = (Math.max(0, corso.fase) + 0.5) / dati.fasi.length;
    $("avBarra").style.width = ((n + dentro) / coda.length * 100).toFixed(1) + "%";
  }
  if (corso) {
    const n = coda.indexOf(corso) + 1;
    $("stato").textContent = `${n} di ${coda.length}: ${corso.titolo} — ${corso.dettaglio || "comincio…"}`;
  } else if (coda.length) {
    $("stato").textContent = `Fatte ${fatte.length} di ${coda.length}` + (errori ? ` · ${errori} con errore` : "");
  } else $("stato").textContent = "";
  // Se non c'è niente aperto, la prima canzone pronta si apre da sola.
  for (const l of fatte) {
    if (!giaFatte.has(l.id)) { giaFatte.add(l.id); if (!aperta) apri(l.id); }
  }
  if ($("dCoda").open) disegnaCoda(coda);
}
function disegnaCoda(coda) {
  const el = $("lavori");
  el.textContent = "";
  if (!coda.length) el.innerHTML = `<p style="opacity:.6">Niente in coda.</p>`;
  for (const l of coda) {
    const r = document.createElement("div");
    r.className = "lavoro";
    const classe = { "fatta": "fatta", "errore": "errore", "in lavorazione": "lavorazione" }[l.stato] || "";
    r.innerHTML = `<span class="esito ${classe}"></span><span class="nome"></span><span class="dett"></span>`;
    r.querySelector(".esito").textContent = l.stato;
    r.querySelector(".nome").textContent = `${l.album} — ${l.titolo}`;
    r.querySelector(".dett").textContent = l.stato === "errore" ? l.registro.slice(-8).join("\n") : l.dettaglio;
    if (l.stato === "fatta") { r.style.cursor = "pointer"; r.onclick = () => { apri(l.id); $("dCoda").close(); }; }
    el.append(r);
  }
}
$("avanzamento").onclick = () => $("stato").click();
$("stato").onclick = async () => { const { coda } = await api("/api/stato"); disegnaCoda(coda); $("dCoda").showModal(); };
$("bSvuota").onclick = async () => { await api("/api/svuota", {}); aggiorna(); };

// Chrome dice quando l'app si può installare: allora compare il pulsante.
let invito = null;
addEventListener("beforeinstallprompt", e => { e.preventDefault(); invito = e; $("bInstalla").hidden = false; });
$("bInstalla").onclick = async () => { if (!invito) return; invito.prompt(); await invito.userChoice; invito = null; $("bInstalla").hidden = true; };
addEventListener("appinstalled", () => { $("bInstalla").hidden = true; });

$("bApri").onclick = mostraApri;
$("bImporta").onclick = mostraImporta;
for (const b of document.querySelectorAll("[data-vai]")) b.onclick = { apri: mostraApri, importa: mostraImporta, libreria: mostraLibreria }[b.dataset.vai];

(async () => {
  if ("serviceWorker" in navigator) navigator.serviceWorker.register("/sw.js").catch(() => {});
  const [{ preferenze = {}, coda = [] }, tutte] = await Promise.all([
    api("/api/stato").catch(() => ({})), api("/api/canzoni").catch(() => []),
  ]);
  coda.filter(l => l.stato === "fatta").forEach(l => giaFatte.add(l.id));
  let ultima = preferenze.ultima;
  try { ultima ||= localStorage.getItem("ultima"); } catch {}
  if (ultima && tutte.some(c => c.id === ultima)) apri(ultima);
  aggiorna();
  setInterval(aggiorna, 2000);
})();
</script>
</html>
