<!doctype html>
<html lang="it">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tab to Music</title>
<style>
  :root { color-scheme: dark; --fondo: #06060b; --pannello: #ffffff08; --bordo: #ffffff14; --testo: #eef0f6; --tenue: #9aa0b4;
          --acceso: #ffb020; --rosa: #ff3d81; --ciano: #2de2e6; --verde: #6bffa0; }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html { background: radial-gradient(1200px 600px at 15% -10%, #ff3d811c, transparent 60%),
                     radial-gradient(1000px 500px at 95% 0%, #2de2e61c, transparent 60%), var(--fondo); background-attachment: fixed; min-height: 100%; }
  body { margin: 0; padding: 0 28px 80px; font: 15px/1.5 system-ui, "Ubuntu", sans-serif; color: var(--testo); }
  #alone { position: fixed; inset: -10%; z-index: -1; background-size: cover; background-position: center;
           filter: blur(90px) saturate(1.6); opacity: .2; pointer-events: none; }
  button { font: inherit; padding: 8px 14px; border: 1px solid var(--bordo); border-radius: 10px; color: var(--testo);
           background: var(--pannello); cursor: pointer; }
  button:hover { border-color: #ffffff33; }
  button.attivo { border-color: var(--acceso); color: var(--acceso); box-shadow: inset 0 0 12px #ffb02022; }
  button.primario { background: linear-gradient(135deg, var(--acceso), var(--rosa)); border: 0; color: #111; font-weight: 700; }
  .testata { display: flex; gap: 22px; align-items: center; padding: 26px 0 14px; }
  #copertina { width: 120px; height: 120px; border-radius: 14px; object-fit: cover; box-shadow: 0 18px 50px #000a, 0 0 0 1px #ffffff1a; }
  .etichetta { font-size: 12px; letter-spacing: .18em; text-transform: uppercase; color: var(--tenue); }
  .etichetta b { color: var(--ciano); }
  h1 { font-size: clamp(22px, 2.6vw, 38px); margin: 6px 0 0; font-weight: 800; line-height: 1.1;
       background: linear-gradient(90deg, #fff, #ffd38a 55%, #ff9bc0); -webkit-background-clip: text; background-clip: text; color: transparent; }
  #album { color: var(--tenue); margin-top: 4px; }
  .riquadro { margin: 10px 0; padding: 12px 16px; border-radius: 14px; border: 1px solid var(--bordo); background: var(--pannello);
              display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
  .riquadro .nota { color: var(--tenue); }
  .riquadro .ok { color: var(--verde); font-weight: 700; }
  #giusta.attivo { border-color: var(--verde); color: var(--verde); }
  .trasporto { position: sticky; top: 0; z-index: 5; display: flex; flex-wrap: wrap; align-items: center; gap: 10px; padding: 12px 16px;
               margin: 12px -16px; border-radius: 16px; background: #0b0b14cc; backdrop-filter: blur(14px); border: 1px solid var(--bordo); }
  #via { width: 52px; height: 52px; border-radius: 50%; padding: 0; font-size: 20px; border: 0; color: #111;
         background: linear-gradient(135deg, var(--acceso), var(--rosa)); box-shadow: 0 0 24px #ff3d8166; }
  #scorri { flex: 1; min-width: 160px; accent-color: var(--acceso); }
  #tempo { font: 600 15px ui-monospace, monospace; color: var(--tenue); min-width: 110px; }
  #stato { color: var(--tenue); font-size: 13px; width: 100%; }
  #tracce { position: sticky; top: 96px; z-index: 4; display: flex; flex-wrap: wrap; gap: 8px; padding: 8px 0; margin-bottom: 8px;
            background: linear-gradient(#06060bf0, #06060bd0); backdrop-filter: blur(8px); }
  .strumento { display: flex; align-items: center; gap: 10px; padding: 8px 14px; text-align: left; }
  .strumento .icona { font-size: 22px; }
  .strumento small { display: block; color: var(--tenue); font-size: 11px; }
  .strumento.attivo { border-color: var(--acceso); background: #ffb0201a; }
  #alphaTab { background: #0b0b14; border: 1px solid var(--bordo); border-radius: 14px; padding: 10px; min-height: 300px; }
  #alphaTab .at-cursor-bar { background: #ffb02022; }
  #alphaTab .at-cursor-beat { background: var(--acceso); width: 3px; box-shadow: 0 0 12px var(--acceso); }
  #alphaTab .at-highlight * { fill: var(--acceso); stroke: var(--acceso); }
  /* Il testo: una colonna fissa a destra, la riga cantata si illumina. */
  body.conTesto { padding-right: 340px; }
  #testo { position: fixed; top: 16px; right: 16px; bottom: 16px; width: 310px; z-index: 6; display: flex; flex-direction: column;
           border: 1px solid var(--bordo); border-radius: 16px; background: #0b0b14e6; backdrop-filter: blur(12px); }
  .testoTesta { padding: 12px 16px; border-bottom: 1px solid var(--bordo); font-weight: 800; letter-spacing: .04em; }
  .testoTesta small { display: block; font-weight: 400; color: var(--tenue); font-size: 11px; letter-spacing: 0; }
  #righe { overflow-y: auto; padding: 40% 16px; scroll-behavior: smooth; }
  .riga { padding: 6px 4px; color: #9aa0b480; font-size: 16px; line-height: 1.35; cursor: pointer; transition: color .25s, transform .25s; }
  .riga:hover { color: var(--testo); }
  .riga.vista { color: #c3c7d8; }
  .riga.ora { color: #fff; font-weight: 700; transform: scale(1.04); transform-origin: left; text-shadow: 0 0 14px #ff3d8155; }
  .riga.vuota { height: 14px; }
  @media (max-width: 1100px) { body.conTesto { padding-right: 28px; } #testo { position: static; width: auto; height: 300px; margin-top: 14px; } }
  dialog { border: 1px solid var(--bordo); border-radius: 16px; background: #0d0d16f2; color: inherit; width: min(720px, 94vw); padding: 0; }
  dialog::backdrop { background: #000a; }
  .dTesta { display: flex; justify-content: space-between; align-items: center; padding: 14px 18px; border-bottom: 1px solid var(--bordo); }
  .dTesta .chiudi { border: 0; background: transparent; font-size: 22px; color: var(--tenue); }
  #candidati { display: flex; flex-direction: column; gap: 6px; padding: 12px 18px; max-height: 50vh; overflow: auto; }
  .candidato { text-align: left; display: flex; flex-direction: column; }
  .candidato small { color: var(--tenue); } .candidato.ha small { color: var(--verde); }
  .carica { display: block; padding: 12px 18px 18px; color: var(--tenue); font-size: 13px; }
  .carica input { display: block; margin-top: 8px; color: var(--testo); }
  .carica textarea { display: block; width: 100%; margin: 8px 0; font: 13px/1.4 ui-monospace, monospace; color: var(--testo);
                     background: #ffffff08; border: 1px solid var(--bordo); border-radius: 10px; padding: 10px; }
</style>
<div id="alone"></div>
<section class="testata">
  <img id="copertina" alt="" hidden>
  <div>
    <div class="etichetta">Library · <b id="artista"></b></div>
    <h1 id="titolo">…</h1>
    <div id="album"></div>
  </div>
</section>

<div class="riquadro" id="tabInfo"><span class="nota">Looking for the tab…</span></div>
<div class="riquadro" id="tracceInfo" hidden></div>

<audio id="disco" preload="auto"></audio>
<div class="trasporto" id="trasporto">
  <button id="via" title="Play / pause (space)">▶</button>
  <input id="scorri" type="range" min="0" max="1000" value="0">
  <span id="tempo">0:00</span>
  <button data-v="0.5">0.5×</button><button data-v="0.75">0.75×</button><button data-v="1" class="attivo">1×</button>
  <button id="prima" title="Move the whole tab a tenth of a second earlier">−0.1 s</button>
  <button id="dopo" title="Move the whole tab a tenth of a second later">+0.1 s</button>
  <button id="rifai" title="Redo the automatic sync, discarding your fixes">Resync</button>
  <span id="stato"></span>
</div>
<div id="tracce"></div>
<div id="alphaTab"></div>
<aside id="testo" hidden>
  <div class="testoTesta">Lyrics <small id="testoFonte"></small></div>
  <div id="righe"></div>
</aside>

<dialog id="dScegli">
  <div class="dTesta"><b>Choose the tab</b><button class="chiudi" aria-label="Close">×</button></div>
  <div id="candidati"></div>
  <label class="carica">…or upload a tab you downloaded (.gp, .gpx, .gp5, .gp4, .gp3)
    <input type="file" id="file" accept=".gp,.gpx,.gp5,.gp4,.gp3,.gtp"></label>
  <div class="carica">…or paste a text tab (the kind with dashes, from any site). Rhythm is guessed from the spacing.
    <textarea id="testoTab" rows="8" spellcheck="false" placeholder="G|-----------------|&#10;D|--5--------------|&#10;A|---3-3-033-5-----|&#10;E|-----------3(3)--|"></textarea>
    <button id="usaTesto" class="primario">Use this text tab</button> <span id="esitoTesto"></span></div>
</dialog>

<script type="module">
import * as alphaTab from "/pwa/alphatab/alphaTab.min.mjs";
const $ = id => document.getElementById(id);
const PERCORSO = new URLSearchParams(location.search).get("percorso");
const P = encodeURIComponent(PERCORSO);
const disco = $("disco");
const orologio = s => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, "0")}`;
const FAMIGLIE = ["Pianoforte", "Percussioni", "Organo", "Chitarra", "Basso", "Archi", "Archi", "Ottoni",
                  "Fiati", "Flauti", "Synth", "Synth", "Effetti", "Etnici", "Percussioni", "Effetti"];
const EN = { Pianoforte: "Piano", Percussioni: "Percussion", Organo: "Organ", Chitarra: "Guitar", Basso: "Bass", Archi: "Strings",
             Ottoni: "Brass", Fiati: "Reeds", Flauti: "Flutes", Synth: "Synth", Effetti: "Effects", Etnici: "Ethnic", Batteria: "Drums",
             Voce: "Vocals", Strumento: "Instrument" };
const ICONE = { Pianoforte: "🎹", Organo: "🎹", Chitarra: "🎸", Basso: "🎸", Batteria: "🥁", Archi: "🎻", Ottoni: "🎺",
                Fiati: "🎷", Flauti: "🪈", Synth: "🎛️", Voce: "🎤" };
const strumentoDi = t => t.playbackInfo?.primaryChannel === 9 || t.staves[0]?.isPercussion ? "Batteria"
  : /voc|voz|voix|voice|vox|sing|canto|coro|choir/i.test(t.name || "") ? "Voce"
  : FAMIGLIE[Math.floor((t.playbackInfo?.program ?? 0) / 8)] || "Strumento";

const info = await fetch(`/api/disco/info?percorso=${P}`).then(r => r.json());
const v = info.voce;
$("titolo").textContent = v.titolo; $("artista").textContent = v.artista; $("album").textContent = v.album;
document.title = `${v.titolo} — Tab to Music`;
$("copertina").src = `/api/disco/copertina?percorso=${P}`;
$("copertina").onload = () => { $("copertina").hidden = false; $("alone").style.backgroundImage = `url('${$("copertina").src}')`; };
disco.src = `/disco/audio?percorso=${P}`;
disco.preservesPitch = true;

// ---------------------------------------------------------------- la tablatura scelta
function mostraTab() {
  const el = $("tabInfo");
  el.textContent = "";
  if (!info.tablatura) {
    el.innerHTML = `<span class="nota">No Guitar Pro tab found for this song.</span>`;
    const scegli = document.createElement("button"); scegli.textContent = "Upload yours…"; scegli.onclick = apriScelta;
    const importa = document.createElement("button"); importa.textContent = "Import (automatic draft)";
    importa.title = "The app listens to the recording and writes its own tab: a draft, useful when no real tab exists";
    importa.onclick = separa;
    el.append(scegli, importa);
    return;
  }
  const t = info.tablatura;
  const nome = (t.nome || "").split("/").pop();
  el.innerHTML = `<span class="nota">Tab: <b style="color:var(--testo)"></b></span>`;
  el.querySelector("b").textContent = nome + (t.tua ? " (yours)" : "");
  if (!t.scelta && t.provate > 1) {
    const n = document.createElement("span"); n.className = "nota";
    n.textContent = `· best match of ${t.provate} versions`;
    n.title = "Every version in the archives was aligned to this recording: this one fits best";
    el.append(n);
  }
  const giusta = document.createElement("button"); giusta.id = "giusta";
  giusta.textContent = t.scelta ? "✓ This one (marked)" : "✓ This one";
  giusta.classList.toggle("attivo", !!t.scelta);
  giusta.title = "Mark this tab for this recording: it will always open";
  giusta.onclick = async () => {
    if (t.tua) return;
    await fetch("/api/disco/scegli", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ percorso: PERCORSO, archivio: t.archivio, nome: t.nome }) });
    t.scelta = true; giusta.textContent = "✓ This one (marked)"; giusta.classList.add("attivo");
  };
  const cambia = document.createElement("button"); cambia.textContent = "Change…"; cambia.onclick = apriScelta;
  el.append(giusta, cambia);
}
async function apriScelta() {
  $("dScegli").showModal();
  const el = $("candidati");
  el.innerHTML = "<p>Searching the archives…</p>";
  const lista = await fetch(`/api/disco/candidati?percorso=${P}`).then(r => r.json()).catch(() => []);
  el.textContent = "";
  if (!lista.length) el.innerHTML = "<p>Not in the archives: upload a tab you downloaded.</p>";
  for (const c of lista) {
    const b = document.createElement("button");
    b.className = "candidato" + (c.ha ? " ha" : "");
    b.innerHTML = "<b></b><small></small>";
    b.querySelector("b").textContent = c.nome.split("/").pop();
    const intesa = c.costo !== undefined && c.costo < 9 ? ` · match ${Math.max(0, Math.round((1 - c.costo) * 100))}%` : "";
    b.querySelector("small").textContent = (c.ha ? "✓ " : "") + (c.strumenti || []).map(x => EN[x] || x).join(", ") + intesa;
    b.onclick = async () => {
      await fetch("/api/disco/scegli", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ percorso: PERCORSO, archivio: c.archivio, nome: c.nome }) });
      location.reload();
    };
    el.append(b);
  }
}
$("file").onchange = async e => {
  const f = e.target.files[0]; if (!f) return;
  await fetch(`/api/disco/carica?percorso=${P}&nome=${encodeURIComponent(f.name)}`, { method: "POST", body: await f.arrayBuffer() });
  location.reload();
};
$("usaTesto").onclick = async () => {
  const r = await fetch("/api/disco/testo_tab", { method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ percorso: PERCORSO, testo: $("testoTab").value }) }).then(r => r.json());
  if (r.errore) { $("esitoTesto").textContent = "Couldn't read it: " + r.errore; return; }
  location.reload();
};
document.querySelector("#dScegli .chiudi").onclick = () => $("dScegli").close();

// ---------------------------------------------------------------- tracce separate
async function separa() {
  const r = await fetch("/api/disco/separa", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ percorso: PERCORSO }) }).then(r => r.json());
  aspetta(r.inLavorazione);
}
function aspetta(id) {
  const el = $("tracceInfo"); el.hidden = false;
  el.innerHTML = `<span class="nota">Working on the recording (3-4 minutes): stems${info.tablatura ? "" : ", automatic tab"} and lyrics.</span>`;
  const giro = setInterval(async () => {
    const { coda } = await fetch("/api/stato").then(r => r.json());
    const l = coda.find(l => `${l.album}/${l.titolo}` === id);
    if (l && l.stato === "fatta") { clearInterval(giro); info.fatta = id; mostraTracce(); }
    if (l && l.stato === "errore") { clearInterval(giro); el.innerHTML = `<span class="nota">Processing the recording failed.</span>`; }
  }, 3000);
}
function mostraTracce() {
  const el = $("tracceInfo"); el.hidden = false; el.textContent = "";
  if (info.fatta) {
    el.innerHTML = `<span class="ok">✓ Stems ready.</span>`;
    const b = document.createElement("button"); b.className = "primario"; b.textContent = "Open with the stem mixer";
    b.title = "Bass, drums, vocals and the rest split apart: mute and solo on the real recording";
    b.onclick = () => { try { localStorage.setItem("vista", info.tablatura ? "gp" : "tab"); } catch {} disco.pause();
      window.parent.apri ? window.parent.apri(info.fatta) : (location.href = "/"); };
    el.append(b);
  } else if (info.tablatura) {
    el.innerHTML = `<span class="nota">Want to mute or solo the bass, vocals or drums of the recording?</span>`;
    const b = document.createElement("button"); b.textContent = "Split stems"; b.onclick = separa; el.append(b);
  }
}
mostraTab(); mostraTracce();
// Senza tablatura il tempo del disco resta quello: la funzione vera arriva con la tablatura.
let versoTab = ms => ms;
if (!info.tablatura) for (const id of ["prima", "dopo", "rifai"]) $(id).hidden = true;

// ---------------------------------------------------------------- il testo
let righe = [], rigaOra = -1;
fetch(`/api/disco/testo?percorso=${P}`).then(r => r.json()).then(t => {
  righe = t.righe || [];
  if (!righe.length) return;
  $("testo").hidden = false;
  document.body.classList.add("conTesto");
  $("testoFonte").textContent = "synced lyrics · LRCLIB";
  const el = $("righe");
  righe.forEach((r, i) => {
    const d = document.createElement("div");
    d.className = "riga" + (r.testo ? "" : " vuota");
    d.textContent = r.testo || "";
    d.onclick = () => { disco.currentTime = r.quando; if (disco.paused) disco.play(); };
    r.el = d;
    el.append(d);
  });
}).catch(() => {});
function seguiTesto(t) {
  if (!righe.length) return;
  let k = -1;
  for (let i = 0; i < righe.length && righe[i].quando <= t + 0.15; i++) k = i;
  if (k === rigaOra) return;
  righe[rigaOra]?.el.classList.remove("ora");
  rigaOra = k;
  righe.forEach((r, i) => r.el.classList.toggle("vista", i < k));
  if (k >= 0) {
    righe[k].el.classList.add("ora");
    const el = $("righe");
    el.scrollTop = righe[k].el.offsetTop - el.clientHeight / 2 + righe[k].el.clientHeight / 2;
  }
}

// ---------------------------------------------------------------- tablatura e sincronia
if (info.tablatura) {
  $("stato").textContent = "Loading the tab…";
  const at = new alphaTab.AlphaTabApi($("alphaTab"), {
    core: { fontDirectory: "/pwa/alphatab/font/" },
    display: { staveProfile: alphaTab.StaveProfile.Tab, resources: { mainGlyphColor: "#d9dcea", secondaryGlyphColor: "#9aa0b4",
               staffLineColor: "#ffffff33", barSeparatorColor: "#ffffff44", scoreInfoColor: "#eef0f6" } },
    player: { playerMode: alphaTab.PlayerMode.EnabledExternalMedia, enableCursor: true, enableAnimatedBeatCursor: true,
              enableUserInteraction: true, scrollMode: alphaTab.ScrollMode.Continuous, scrollOffsetY: -200 },
  });
  window.at = at;
  let score = null, vista = 0;
  // La corrispondenza fra i due tempi, battuta per battuta (nell'ordine in cui si
  // suonano, ritornelli compresi): G = millisecondi nella tablatura al suo tempo,
  // A = millisecondi nel disco. La calcoliamo noi e ad alphaTab passiamo solo
  // la posizione: i suoi «sync points» non cambiavano il cursore (+0,1 s non faceva niente).
  let battute = [], G = [], A0 = [], A = [], spostamento = 0, correzioni = {};

  function battuteDelFile() {
    // Dalla tabella di alphaTab: inizio e fine in tick, e il tempo di ogni battuta.
    const lista = at.tickCache.masterBars;
    let ms = 0;
    return lista.map(x => {
      const cambi = (x.tempoChanges || []).filter(c => c.tick >= x.start && c.tick < x.end).sort((a, b) => a.tick - b.tick);
      let durata = 0, tick = x.start, bpm = cambi.length ? cambi[0].tempo : (x.previousMasterBar ? undefined : score.tempo) || 120;
      bpm = bpm || battute.ultimoBpm || score.tempo || 120;
      for (const c of cambi) { durata += (c.tick - tick) / 960 * 60000 / bpm; tick = c.tick; bpm = c.tempo; }
      durata += (x.end - tick) / 960 * 60000 / bpm;
      battute.ultimoBpm = bpm;
      const voce = { bar: x.masterBar.index, inizioTick: x.start, fineTick: x.end, inizio: ms, durata };
      ms += durata;
      return voce;
    });
  }
  function eventiDelFile() {
    // Le note di tutti gli strumenti (non la batteria), nel tempo della tablatura.
    const eventi = [];
    for (const o of battute) {
      const lunghezza = o.fineTick - o.inizioTick;
      for (const tr of score.tracks) {
        if (strumentoDi(tr) === "Batteria") continue;
        const bar = tr.staves[0].bars[o.bar]; if (!bar) continue;
        for (const voce of bar.voices) for (const beat of voce.beats) {
          if (beat.isRest) continue;
          for (const n of beat.notes) eventi.push({
            inizio: o.inizio + beat.playbackStart / lunghezza * o.durata,
            durata: beat.playbackDuration / lunghezza * o.durata, midi: n.realValue });
        }
      }
    }
    return eventi;
  }
  function ricalcola(salva) {
    // A = automatica + spostamento globale + correzioni a mano (da una battuta in poi).
    let extra = 0;
    A = A0.map((t, k) => { if (correzioni[k] !== undefined) extra = correzioni[k]; return Math.max(0, t + spostamento + extra); });
    for (let k = 1; k < A.length; k++) A[k] = Math.max(A[k], A[k - 1]);
    if (salva) fetch("/api/disco/sincronia", { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ percorso: PERCORSO, punti: { spostamento, correzioni } }) });
  }
  // Dal tempo del disco al tempo della tablatura, e ritorno.
  versoTab = function (ms) {
    if (!A.length) return ms;
    let k = 0, a = 0, b = A.length - 1;
    while (a <= b) { const m = (a + b) >> 1; if (A[m] <= ms) { k = m; a = m + 1; } else b = m - 1; }
    if (ms < A[0]) return Math.max(0, G[0] - (A[0] - ms));
    const fineA = k + 1 < A.length ? A[k + 1] : A[k] + battute[k].durata;
    const fineG = G[k] + battute[k].durata;
    return G[k] + (ms - A[k]) / Math.max(1, fineA - A[k]) * (fineG - G[k]);
  }
  function versoDisco(msTab) {
    let k = 0;
    while (k + 1 < G.length && G[k + 1] <= msTab) k++;
    const fineA = k + 1 < A.length ? A[k + 1] : A[k] + battute[k].durata;
    return A[k] + (msTab - G[k]) / Math.max(1, battute[k].durata) * (fineA - A[k]);
  }
  async function sincronizza(forza) {
    const salvata = forza ? {} : await fetch(`/api/disco/sincronia?percorso=${P}`).then(r => r.json()).catch(() => ({}));
    let ms = salvata.automatica;
    if (!ms || ms.length !== battute.length) {
      $("stato").textContent = "Syncing the tab to the recording…";
      const r = await fetch("/api/allinea", { method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ percorso: PERCORSO, eventi: eventiDelFile(), battute: G }) }).then(r => r.json());
      ms = r.automatica; salvata.punti = null;
    }
    A0 = ms;
    const p = salvata.punti && !Array.isArray(salvata.punti) ? salvata.punti : {};
    spostamento = forza ? 0 : p.spostamento || 0;
    correzioni = forza ? {} : p.correzioni || {};
    ricalcola(forza);
    $("stato").textContent = Object.keys(correzioni).length || spostamento ? "Saved sync (with your fixes)."
      : "Synced to the recording. If a bar is off: while playing, click it at the right moment.";
  }
  at.playerReady.on(() => {
    at.player.output.handler = {
      get backingTrackDuration() { return Math.max((disco.duration || 0) * 1000, G.length ? G.at(-1) + battute.at(-1).durata : 0); },
      get playbackRate() { return disco.playbackRate; }, set playbackRate(x) {},
      get masterVolume() { return disco.volume; }, set masterVolume(x) {},
      // alphaTab chiede un punto della tablatura (clic su una nota): lo si traduce nel disco.
      seekTo(msTab) { if (!stoCorreggendo) disco.currentTime = versoDisco(msTab) / 1000; },
      play() { disco.play(); }, pause() { disco.pause(); },
    };
  });
  let stoCorreggendo = false;
  // Un file Guitar Pro si carica com'è; una tablatura di testo è già stata convertita in alphaTex.
  if ((info.tablatura.tua || "").endsWith(".atex")) fetch(`/api/disco/gp?percorso=${P}`).then(r => r.text()).then(t => at.tex(t));
  else fetch(`/api/disco/gp?percorso=${P}`).then(r => r.arrayBuffer()).then(b => at.load(new Uint8Array(b)));
  at.scoreLoaded.on(s => {
    score = s;
    vista = Math.max(0, s.tracks.findIndex(t => strumentoDi(t) === "Basso"));
    disegnaStrumenti();
    at.renderTracks([s.tracks[vista]]);
  });
  // La tabella delle battute c'è solo quando alphaTab ha preparato la partitura da suonare.
  at.midiLoaded.on(() => {
    if (battute.length) return;
    battute = battuteDelFile();
    G = battute.map(o => o.inizio);
    if (disco.readyState >= 1) sincronizza(); else disco.addEventListener("loadedmetadata", () => sincronizza(), { once: true });
  });
  function disegnaStrumenti() {
    const el = $("tracce"); el.textContent = "";
    score.tracks.forEach((t, i) => {
      const tipo = strumentoDi(t);
      const b = document.createElement("button");
      b.className = "strumento" + (i === vista ? " attivo" : "");
      b.innerHTML = `<span class="icona">${ICONE[tipo] || "🎵"}</span><span><b></b><small></small></span>`;
      b.querySelector("b").textContent = t.name?.trim() || EN[tipo] || tipo;
      b.querySelector("small").textContent = t.name?.trim() ? EN[tipo] || tipo : `track ${i + 1}`;
      b.onclick = () => { vista = i; disegnaStrumenti(); at.renderTracks([t]); };
      el.append(b);
    });
  }
  // Correzione a mano: mentre suona, un clic su una battuta dice «comincia adesso».
  at.beatMouseDown.on(beat => {
    if (!A.length || disco.paused) return;
    stoCorreggendo = true; setTimeout(() => { stoCorreggendo = false; }, 400);
    const bar = beat.voice.bar.index, adesso = disco.currentTime * 1000;
    let k = -1, d = Infinity;
    battute.forEach((o, i) => { if (o.bar === bar && Math.abs(A[i] - adesso) < d) { k = i; d = Math.abs(A[i] - adesso); } });
    if (k < 0) return;
    // La correzione vale da questa battuta in poi.
    let extraPrima = 0;
    for (let i = 0; i <= k; i++) if (correzioni[i] !== undefined) extraPrima = correzioni[i];
    correzioni[k] = extraPrima + (adesso - A[k]);
    ricalcola(true);
    $("stato").textContent = `Bar ${bar + 1} locked at ${orologio(adesso / 1000)}.`;
  });
  $("prima").onclick = () => { spostamento -= 100; ricalcola(true); $("stato").textContent = `Tab shifted ${spostamento > 0 ? "+" : ""}${(spostamento / 1000).toFixed(1)} s.`; };
  $("dopo").onclick = () => { spostamento += 100; ricalcola(true); $("stato").textContent = `Tab shifted ${spostamento > 0 ? "+" : ""}${(spostamento / 1000).toFixed(1)} s.`; };
  $("rifai").onclick = () => sincronizza(true);

}

// ---------------------------------------------------------------- il lettore del disco (anche senza tablatura)
$("via").onclick = () => (disco.paused ? (disco.play(), window.at?.play()) : (disco.pause(), window.at?.pause()));
disco.onplay = () => { $("via").textContent = "⏸"; };
disco.onpause = () => { $("via").textContent = "▶"; };
$("scorri").oninput = () => { disco.currentTime = $("scorri").value / 1000 * (disco.duration || 0); };
for (const b of document.querySelectorAll("[data-v]")) b.onclick = () => {
  disco.playbackRate = Number(b.dataset.v);
  document.querySelectorAll("[data-v]").forEach(x => x.classList.toggle("attivo", x === b));
};
addEventListener("keydown", e => { if (e.code === "Space" && !/INPUT|BUTTON/.test(document.activeElement.tagName)) { e.preventDefault(); $("via").click(); } });
const giro = () => {
  const t = disco.currentTime;
  try { window.at?.player?.output?.updatePosition?.(versoTab(t * 1000)); } catch {}
  seguiTesto(t);
  $("tempo").textContent = `${orologio(t)} / ${orologio(disco.duration || 0)}`;
  if (disco.duration) $("scorri").value = Math.round(t / disco.duration * 1000);
  requestAnimationFrame(giro);
};
requestAnimationFrame(giro);
</script>
</html>
